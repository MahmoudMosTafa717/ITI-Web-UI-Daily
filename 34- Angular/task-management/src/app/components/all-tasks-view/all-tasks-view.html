@if (tasks.length === 0) {
  <p class="tasks-empty">No tasks yet. Add one using the form.</p>
}
@for (task of tasks; track task.id) {
  <app-task-card
    [task]="task"
    (deleteTask)="deleteTask.emit($event)"
    (toggleDone)="toggleDone.emit($event)"
    (updateTask)="updateTask.emit($event)"
    (validationError)="validationError.emit($event)"
  ></app-task-card>
}
